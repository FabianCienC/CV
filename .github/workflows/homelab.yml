name: Build and deploy to homelab

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: write   # para guardar el tag nuevo en k8s/deployment.yaml
  packages: write   # para subir la imagen a ghcr.io

concurrency:
  group: homelab
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/fabiancienc/cv

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # Flux en el homelab detecta este commit y despliega la imagen nueva.
      - name: Update image tag in k8s manifests
        run: |
          sed -i -E "s#^([[:space:]]*image:[[:space:]]*)ghcr\.io/[^/]+/cv(:[^[:space:]]*)?#\1${IMAGE}:${GITHUB_SHA}#I" k8s/deployment.yaml
          echo "Línea image actual:"
          grep -n "image:" k8s/deployment.yaml
          if git diff --quiet; then
            echo "El tag ya estaba actualizado; nada que hacer."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: cv ${GITHUB_SHA::7}"
          git push

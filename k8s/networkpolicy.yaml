apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: cv
spec:
  headers:
    # HSTS: obliga HTTPS por 1 año. forceSTSHeader porque cloudflared habla HTTP con Traefik.
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    forceSTSHeader: true
    frameDeny: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"
    # Si algo del CV deja de cargar, revisa la consola del navegador y ajusta esta línea.
    contentSecurityPolicy: "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; frame-ancestors 'none'"

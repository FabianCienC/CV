apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cv
  namespace: cv
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: cv-security-headers@kubernetescrd
spec:
  rules:
    - host: cv.fabiancienfuegos.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: { name: cv, port: { number: 80 } }

name: Build and deploy to homelab

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: write   # para guardar el tag nuevo en k8s/deployment.yaml
  packages: write   # para subir la imagen a ghcr.io

concurrency:
  group: homelab
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/fabiancienc/cv

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      # Flux en el homelab detecta este commit y despliega la imagen nueva.
      - name: Update image tag in k8s manifests
        run: |
          sed -i "s#image: ${IMAGE}:.*#image: ${IMAGE}:${GITHUB_SHA}#" k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "deploy: cv ${GITHUB_SHA::7}"
          git push

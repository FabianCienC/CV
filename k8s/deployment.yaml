apiVersion: apps/v1
kind: Deployment
metadata:
  name: cv
  namespace: cv
spec:
  replicas: 1
  selector:
    matchLabels: { app: cv }
  template:
    metadata:
      labels: { app: cv }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cv
          image: ghcr.io/fabiancienc/cv:3feea4e0ca22f7f6467787075023571a5881d305
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            httpGet: { path: /, port: 8080 }
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          # nginx solo necesita escribir su pid y archivos temporales; todo lo demás es de solo lectura.
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
        - { name: nginx-cache, emptyDir: { sizeLimit: 16Mi } }
